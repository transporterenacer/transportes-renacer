{% extends "base.html" %}
{% load static %}
{% block title %}Iniciar sesión{% endblock %}
{% block body_class %}login{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <img class="login-logo" src="{% static 'img/logo_sin_fondo.png' %}" alt="Transportes Renacer">
    <h1>Iniciar sesión</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    {% if form.errors %}
      <p class="form-error">Usuario o contraseña incorrectos.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
