services:
  - type: web
    name: transportes-renacer
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: transportes-renacer.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://transportes-renacer.onrender.com"
      - key: DEBUG
        value: "false"
